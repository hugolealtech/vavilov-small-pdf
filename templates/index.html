<!DOCTYPE html>
<html>
<head>
    <title>Vavilov PDF</title>
    <style>
        body { background: #0f172a; color: #e2e8f0; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: #1e293b; padding: 40px; border-radius: 10px; text-align: center; border: 1px solid #334155; width: 350px; }
        h1 { color: #38bdf8; margin-bottom: 20px; }
        input { margin-bottom: 20px; color: #fff; }
        button { background: #0ea5e9; color: white; border: none; padding: 12px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; }
        button:hover { background: #0284c7; }
    </style>
</head>
<body>
    <div class="box">
        <h1>Vavilov PDF</h1>
        <form action="/" method="POST" enctype="multipart/form-data">
            <input type="file" name="pdf_file" accept=".pdf" required>
            <button type="submit">Esmagar PDF</button>
        </form>
    </div>
</body>
</html>
